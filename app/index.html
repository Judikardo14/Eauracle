<title>Eauracle</title>
<style>
:root{--fond:#07131f;--carte:rgba(17,34,52,.67);--carte-forte:rgba(20,42,63,.86);--encre:#f2f7fb;--doux:#91a7b9;--bord:rgba(179,215,232,.16);--eau:#5ce1d2;--eau-fonce:#2eaaa8;

*{box-sizing:border-box}
html{min-height:100%;background:var(--fond)}
body{min-height:100vh;margin:0;background:radial-gradient(circle at 8% 0%,rgba(54,190,192,.18),transparent 30rem),radial-gradient(circle at 92% 10%,rgba(76,111,255,.16),transparent 34rem),linear-gradient(145deg,#07131f 0%,#091d2d 52%,#07111d 100%);color:var(--encre);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;letter-spacing:.005em;font-kerning:normal;text-rendering:optimizeLegibility}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
main{max-width:1240px;margin:0 auto;padding:30px 24px 70px;position:relative}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.04em;font-kerning:normal;text-wrap:balance}
h1{font-size:clamp(2.35rem,4.2vw,4rem);line-height:.98;background:linear-gradient(110deg,#fff 18%,#a7f5e8 70%,#8bc4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(1.45rem,2.4vw,1.8rem);line-height:1.08}h3{font-size:.98rem;line-height:1.25;margin:0 0 10px;color:#dcebf2}
.entete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:flex-start;padding:22px 24px 26px;border:1px solid var(--bord);border-radius:28px;background:linear-gradient(135deg,rgba(24,56,78,.75),rgba(8,27,43,.52));box-shadow:0 24px 80px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.entete:after{content:"";display:block;width:90px;height:90px;position:absolute;right:13%;top:5px;border-radius:50%;background:rgba(92,225,210,.17);filter:blur(22px);pointer-events:none}
.entete p{margin:11px 0 0;color:#a8bdca;max-width:58ch;font-size:.98rem;line-height:1.6}
.langues{display:flex;gap:0;position:relative;z-index:1}
.langues button{font:inherit;font-size:.78rem;letter-spacing:.01em;padding:8px 13px;border:1px solid var(--bord);background:rgba(255,255,255,.045);color:var(--doux);cursor:pointer;transition:.2s}
.langues button:first-child{border-radius:12px 0 0 12px}.langues button:last-child{border-radius:0 12px 12px 0;border-left:0}
.langues button[aria-pressed=true]{background:var(--eau);color:#06212b;border-color:var(--eau);font-weight:700}
button:focus-visible,summary:focus-visible{outline:2px solid var(--eau);outline-offset:3px}
.bandeau{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}
.etiq{padding:6px 11px;border-radius:999px;border:1px solid var(--bord);background:rgba(255,255,255,.045);color:#b8cbd5;font-size:.77rem;backdrop-filter:blur(10px)}
.etiq:before{content:"•";color:var(--eau);margin-right:6px}.etiq.alerte{border-color:rgba(255,154,103,.42);color:#ffc19e}.etiq.alerte:before{color:var(--a-alerte)}
.resume{background:linear-gradient(100deg,rgba(37,114,117,.31),rgba(19,51,70,.46));border:1px solid rgba(92,225,210,.22);border-left:3px solid var(--eau);padding:16px 20px;border-radius:17px;margin:8px 0 24px;box-shadow:0 12px 40px rgba(0,0,0,.15)}
.resume h3{color:var(--eau);font-size:.8rem;text-transform:uppercase;letter-spacing:.13em}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:18px}
.carte,.commande,.fil,details{background:linear-gradient(145deg,rgba(25,49,70,.77),rgba(11,28,44,.64));border:1px solid var(--bord);border-radius:22px;padding:21px;box-shadow:0 18px 55px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.045);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.carte{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}.carte:hover{transform:translateY(-3px);border-color:rgba(92,225,210,.3);box-shadow:0 24px 65px rgba(0,0,0,.3),0 0 0 1px rgba(92,225,210,.06)}
.tete{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}
.tete h2:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--eau);box-shadow:0 0 14px var(--eau);vertical-align:middle;margin:0 10px 3px 0}
.puce{--c:var(--doux);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 52%,transparent);padding:4px 10px;border-radius:999px;font-weight:650;font-size:.76rem;white-space:nowrap}
.jauge{position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
.jauge i{position:absolute;inset:0 auto 0 0;border-radius:10px;box-shadow:0 0 16px currentColor;animation:montee .8s ease-out}
.jauge b{position:absolute;top:-3px;bottom:-3px;width:1px;background:#d9eef4;opacity:.5}
@keyframes montee{from{width:0!important}}
.legende{display:flex;justify-content:space-between;font-size:.75rem;color:var(--doux);margin:8px 0 16px}
.legende span:first-child{color:#d8e9ef;font-weight:600}
.mesures{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:17px}
.mesures div{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.055);border-radius:13px;padding:10px 9px}
.mesures strong{display:block;font-size:1.05rem;letter-spacing:-.03em}.mesures span{font-size:.7rem;color:var(--doux)}
.photo{display:grid;grid-template-columns:170px 1fr;gap:15px;margin:13px 0}
.photo img,.vide{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--bord)}
.photo img{box-shadow:0 10px 25px rgba(0,0,0,.25)}.vide{display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;color:var(--doux);padding:6px}
.barre{height:7px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 9px}.barre i{display:block;height:100%;background:linear-gradient(90deg,#2caaa8,var(--eau));border-radius:7px}
.petit{font-size:.78rem;color:var(--doux);margin:5px 0}ul.desc{margin:7px 0 0;padding-left:18px;font-size:.8rem;color:#c5d6dd}
.alerte-msg{border:1px solid color-mix(in srgb,var(--c) 64%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:14px;padding:13px 14px;margin-top:12px}.alerte-msg p{margin:7px 0 0;color:#f2f7f8}
.decision{font-size:.82rem;color:#b9cdd5;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.1)}
.chat{margin-top:30px}.chat h2{margin-bottom:4px}.onglets{display:flex;gap:7px;margin:13px 0}.onglets button{font:inherit;font-size:.8rem;padding:7px 14px;border-radius:10px;border:1px solid var(--bord);background:rgba(255,255,255,.04);color:var(--doux);cursor:pointer}.onglets button[aria-pressed=true]{background:rgba(92,225,210,.16);border-color:rgba(92,225,210,.5);color:var(--eau)}
.fil{display:flex;flex-direction:column;gap:10px;min-height:120px}.msg{max-width:78%;padding:10px 13px;border-radius:15px;font-size:.84rem}.msg small{display:block;color:var(--eau);margin-bottom:3px;font-size:.7rem;font-weight:650;text-transform:uppercase;letter-spacing:.08em}.msg.agent{align-self:flex-start;background:rgba(92,225,210,.1);border:1px solid rgba(92,225,210,.14)}.msg.relais{align-self:flex-end;background:rgba(161,187,203,.1);border:1px solid rgba(161,187,203,.12)}.msg.sys{align-self:center;max-width:100%;font-size:.75rem;color:var(--doux);text-align:center}.msg img{width:220px;max-width:100%;border-radius:10px;display:block;margin-top:6px}
details{margin-top:26px;padding:15px 19px}summary{cursor:pointer;font-weight:650;color:#d3e4ea}.ligne{display:grid;grid-template-columns:34px 170px 1fr;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:.73rem}.ligne code{word-break:break-word;color:var(--doux)}
footer{margin-top:28px;font-size:.75rem;color:#718b9b;max-width:80ch}.commande{margin:0 0 24px;padding:21px}.commande h3{font-size:1.12rem}.commande .choix{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 17px}.commande label{color:#c6d8df;font-size:.84rem}.commande input{accent-color:var(--eau)}.commande select{font:inherit;font-size:.84rem;padding:8px 10px;border-radius:10px;border:1px solid var(--bord);background:rgba(255,255,255,.06);color:var(--encre);max-width:100%;margin-left:7px}
button.lancer{background:linear-gradient(110deg,#5ce1d2,#62bff5);color:#06202a;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-size:.84rem;font-weight:750;cursor:pointer;margin-top:12px;box-shadow:0 8px 22px rgba(65,205,202,.22);transition:transform .2s,box-shadow .2s}button.lancer:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(65,205,202,.34)}button.lancer:disabled{opacity:.6;cursor:wait;transform:none}
.erreur{border:1px solid rgba(255,110,125,.55);background:rgba(255,110,125,.1);color:#ffb1b8;border-radius:12px;padding:9px 12px;margin-top:12px;font-size:.8rem}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:22px;align-items:center;margin:20px 0 24px;padding:28px 30px;border:1px solid rgba(130,221,221,.22);border-radius:26px;background:linear-gradient(115deg,rgba(20,66,79,.78),rgba(12,35,57,.76) 58%,rgba(36,47,94,.58));box-shadow:0 25px 80px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.1);overflow:hidden;position:relative}
.hero:before{content:"";position:absolute;width:420px;height:420px;right:-110px;top:-210px;border-radius:50%;border:1px solid rgba(92,225,210,.16);box-shadow:0 0 0 24px rgba(92,225,210,.025),0 0 0 48px rgba(92,225,210,.02);pointer-events:none}
.hero:after{content:"";position:absolute;inset:auto -10% -55px -5%;height:100px;background:radial-gradient(ellipse,rgba(92,225,210,.25),transparent 68%);filter:blur(16px);pointer-events:none}
.hero-copy{position:relative;z-index:1}.hero-kicker{display:flex;align-items:center;gap:9px;color:var(--eau);font-size:.7rem;font-weight:750;letter-spacing:.16em;text-transform:uppercase}.hero-kicker i{width:7px;height:7px;border-radius:50%;background:var(--eau);box-shadow:0 0 14px var(--eau);animation:pulse 2s infinite}.hero h2{font-size:clamp(1.7rem,3vw,2.7rem);line-height:1.05;max-width:14ch;margin:12px 0}.hero-copy p{color:#a7c2ce;max-width:47ch;margin:0;font-size:.9rem}.hero-flow{height:36px;margin-top:23px;position:relative;overflow:hidden}.hero-flow:before,.hero-flow:after{content:"";position:absolute;left:-5%;right:-5%;height:15px;border-top:1px solid rgba(92,225,210,.6);border-radius:50%;transform:rotate(-2deg)}.hero-flow:before{top:8px;box-shadow:0 9px rgba(92,225,210,.16),0 18px rgba(92,225,210,.08)}.hero-flow:after{top:14px;opacity:.5;transform:rotate(3deg)}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 24px var(--eau)}}.hero-signal{display:flex;align-items:center;justify-content:center;position:relative;z-index:1}.signal-ring{width:178px;height:178px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--eau) var(--progress),rgba(255,255,255,.08) 0);box-shadow:0 0 50px rgba(92,225,210,.14);position:relative}.signal-ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#102e3d;border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 0 25px rgba(0,0,0,.25)}.signal-value{position:relative;text-align:center}.signal-value strong{display:block;font-size:2.5rem;line-height:1;letter-spacing:-.08em}.signal-value span{display:block;color:var(--doux);font-size:.68rem;margin-top:8px;text-transform:uppercase;letter-spacing:.12em}.hero-meta{display:flex;gap:16px;margin-top:18px;color:#b8d2dc;font-size:.76rem}.hero-meta strong{color:#fff;font-size:1.05rem;margin-right:4px}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding:23px}.hero-signal{justify-content:flex-start}.signal-ring{width:138px;height:138px}.signal-value strong{font-size:2rem}}
@media(max-width:650px){main{padding:16px 13px 50px}.entete{padding:19px;border-radius:22px}.mesures{grid-template-columns:repeat(2,1fr)}.photo{grid-template-columns:1fr}.ligne{grid-template-columns:28px 1fr}.ligne code{grid-column:1/-1}.msg{max-width:92%}.carte,.commande,.fil,details{border-radius:18px;padding:17px}}
</style>

 recu:"Photo envoyée par le relais",mesure:"SAM 3.1 a mesuré",d_eau:"de l'image couverte d'eau, gravité",systeme:"Envoi simulé enregistré. En attente de validation par l'autorité locale.",
 pied:"Le débit vient de la simulation GloFAS, pas de mesures de station. La pluie vient d'Open-Meteo. Les seuils de gravité (10 % et 30 % d'eau) sont des heuristiques. Le modèle de risque est un signal parmi d'autres : l'agent pèse aussi les photos.",
 lancer:"Lancer l'agent",zonesTitre:"Zones à analyser",donnees:"Données",dateRejeu:"Rejeu de la crue d'août 2002",dateDirect:"Données du jour",enCours:"L'agent travaille",dernier:"Dernier outil appelé",termine:"Exécution terminée",echec:"L'exécution a échoué",lancerNote:"Lance le vrai agent : Muse Spark Open sur Baseten et SAM 3.1 sur la Meta Model API. Compter environ une minute.",vivant:"Exécution lancée depuis cette page",kicker:"BASSIN DE L'OUÉMÉ / ALERTE PRÉCOCE",heroTitle:"Lire le fleuve avant qu'il ne monte.",heroCopy:"Une interface calme pour une décision complexe : signaux du modèle, preuve terrain et prochaine action traçable.",signal:"signal de risque",zonesCount:"zones suivies",calls:"appels agent",
 niv:{faible:"Faible",moyen:"Moyen",eleve:"Élevé",crue_en_cours:"Crue en cours"},al:{vigilance:"Vigilance",alerte:"Alerte",urgence:"Urgence"},gr:{faible:"faible",moyenne:"moyenne",elevee:"élevée"},lang:"Langue"}};

let langue="en",journal=DONNEES_DEMO,source="exemple",zoneChat=0;
let apiDispo=false,enCours=false,erreurAgent=null,traceOuverte=false,signature="",minuterie=null;
let zonesChoisies=["Bonou","Porto-Novo"],dateChoisie="2002-08-04";
const ZONES_CHOIX=["Bonou","Porto-Novo","Adjohoun","Dangbo"];
try{langue=localStorage.getItem("eauracle_langue")||"en"}catch(e){}
const t=c=>TEXTES[langue][c];
const echapper=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normaliser=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g,"_");
const nomFichier=c=>String(c||"").split(/[\\/]/).pop();
const nombre=(x,d=1)=>Number(x).toLocaleString(langue==="fr"?"fr-FR":"en-US",{maximumFractionDigits:d});
const enGras=s=>echapper(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/^- /gm,"• ").replace(/\n/g,"<br>");

function construireZones(trace){
 const zones=new Map();
 const zone=n=>{if(!zones.has(n))zones.set(n,{nom:n});return zones.get(n)};
 for(const e of trace){
  const r=e.resultat||{},a=e.arguments||{};
  if(e.outil==="get_flood_risk")zone(a.zone||r.zone).risque=r;
  else if(e.outil==="request_photos")zone(a.zone||r.zone).demande={...r,raison:a.raison};
  else if(e.outil==="analyze_flood_photo"){const f=r.photo||nomFichier(a.chemin_photo);zone(f.split("_")[0]).analyse={...r,fichier:f}}
  else if(e.outil==="draft_alert")zone(a.zone||r.zone).brouillon=r;
  else if(e.outil==="send_alert")zone(a.zone||r.zone).envoi=r;
  else if(e.outil==="log_decision")zone(a.zone||r.zone).decision=r.justification;
 }
 return [...zones.values()];
}
const imageHtml=f=>`<img src="photos/${encodeURIComponent(f)}" alt="${echapper(f)}" onerror="this.outerHTML='<div class=vide>${echapper(t("sansImage"))}</div>'">`;

function carteZone(z){
 const r=z.risque||{},n=normaliser(r.niveau),a=z.analyse,b=z.brouillon,s=Number(r.score_risque||0);
 const gr=a?normaliser(a.gravite):"";
 const photo=a?`<div class="photo">${imageHtml(a.fichier)}<div>
  <strong>${t("partEau")}: ${nombre(a.part_eau_mesuree_pct)}%</strong>
  <div class="barre"><i style="width:${Math.min(100,a.part_eau_mesuree_pct)}%"></i></div>
  <div class="petit">${t("confiance")}: ${nombre(a.confiance_sam,2)}</div>
  <div class="petit">${t("gravite")}: <span class="puce" style="--c:var(--n-${gr==="elevee"?"eleve":gr==="moyenne"?"moyen":"faible"})">${echapper(t("gr")[gr]||a.gravite)}</span></div>
  <ul class="desc">${(a.description_muse||[]).map(d=>`<li>${echapper(d)}</li>`).join("")}</ul></div></div>`
  :`<p class="petit">${t("aucune")}</p>`;
 const al=b?`<div class="alerte-msg" style="--c:var(--a-${b.niveau})"><span class="puce" style="--c:var(--a-${b.niveau})">${echapper(t("al")[b.niveau]||b.niveau)}</span>
  <p>${echapper(b.message)}</p><div class="petit">${t("langueAlerte")} ${z.envoi?t("envoye"):""}</div></div>`:"";
 return `<section class="carte"><div class="tete"><h2>${echapper(z.nom)}</h2><span class="puce" style="--c:var(--n-${n})">${echapper(t("niv")[n]||r.niveau)}</span></div>
 <div class="jauge" role="img" aria-label="${t("score")} ${nombre(s,2)}"><i style="width:${Math.round(s*100)}%;background:var(--n-${n})"></i><b style="left:${SEUIL_MOYEN*100}%"></b><b style="left:${SEUIL_ELEVE*100}%"></b></div>
 <div class="legende"><span>${t("score")}: ${nombre(s,2)}</span><span>${t("niv").moyen} ${SEUIL_MOYEN} | ${t("niv").eleve} ${SEUIL_ELEVE}</span></div>
 <div class="mesures"><div><strong>${nombre(r.debit_actuel_m3s)} m³/s</strong><span>${t("debit")}</span></div>
 <div><strong>${Math.round((r.debit_relatif_au_seuil_crue||0)*100)}%</strong><span>${t("seuil")}</span></div>
 <div><strong>${r.variation_3j_relative>=0?"+":""}${nombre((r.variation_3j_relative||0)*100)}%</strong><span>${t("var3j")}</span></div>
 <div><strong>${nombre(r.pluie_7j_mm)} mm</strong><span>${t("pluie")}</span></div></div>
 <h3>${t("photo")}</h3>${photo}${al}
 ${z.decision?`<div class="decision"><strong>${t("decision")}.</strong> ${echapper(z.decision)}</div>`:""}</section>`;
}

function fil(z){
 const m=[],r=z.risque||{},a=z.analyse,b=z.brouillon;
 if(z.demande)m.push(`<div class="msg agent"><small>${t("agent")}</small>${t("demande")}: ${echapper(z.demande.raison||"")}</div>`);
 if(z.demande&&a)m.push(`<div class="msg relais"><small>${t("relais")}</small>${t("recu")}${imageHtml(a.fichier)}</div>`);
 else if(z.demande)m.push(`<div class="msg relais"><small>${t("relais")}</small>${t("aucune")}</div>`);
 if(a)m.push(`<div class="msg agent"><small>${t("agent")}</small>${t("mesure")} ${nombre(a.part_eau_mesuree_pct)}% ${t("d_eau")} ${echapper(t("gr")[normaliser(a.gravite)]||a.gravite)} (${t("confiance").toLowerCase()} ${nombre(a.confiance_sam,2)}).</div>`);
 if(b)m.push(`<div class="msg agent"><small>${t("agent")} | ${echapper(t("al")[b.niveau]||b.niveau)}</small>${echapper(b.message)}</div>`);
 if(z.envoi)m.push(`<div class="msg sys">${t("systeme")}</div>`);
 if(z.decision)m.push(`<div class="msg agent"><small>${t("decision")}</small>${echapper(z.decision)}</div>`);
 return m.join("");
}

function rendre(){
 document.documentElement.lang=langue;
 const zones=construireZones(journal.trace||[]);
 if(zoneChat>=zones.length)zoneChat=0;
 const meta=journal.meta||{};
 const scores=zones.map(z=>Number(z.risque?.score_risque||0)).filter(Number.isFinite);
 const scoreGlobal=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
 const signal=Math.round(scoreGlobal*100);
 const nbAlertes=zones.filter(z=>z.brouillon||z.envoi).length;
 const lignes=(journal.trace||[]).map(e=>`<div class="ligne"><span>${e.tour}</span><strong>${echapper(e.outil)}</strong><code>${echapper(JSON.stringify(e.arguments)).slice(0,160)} → ${echapper(JSON.stringify(e.resultat)).slice(0,240)}</code></div>`).join("");
 document.getElementById("app").innerHTML=`
 <div class="entete"><div><h1>Eauracle</h1><p>${t("sous")}</p></div>
 <div class="langues" role="group" aria-label="${t("lang")}"><button aria-pressed="${langue==="en"}" onclick="changerLangue('en')">English</button><button aria-pressed="${langue==="fr"}" onclick="changerLangue('fr')">Français</button></div></div>
 <div class="bandeau"><span class="etiq">${meta.rejeu?t("rejeu")+" "+echapper(meta.date):t("direct")}</span><span class="etiq">${t(source)}</span>
 ${meta.modele?`<span class="etiq">${t("modele")}: ${echapper(meta.modele)}</span>`:""}<span class="etiq">${t("simule")}</span><span class="etiq alerte">${t("brouillons")}</span></div>
 <section class="hero"><div class="hero-copy"><div class="hero-kicker"><i></i>${t("kicker")}</div><h2>${t("heroTitle")}</h2><p>${t("heroCopy")}</p><div class="hero-flow"></div><div class="hero-meta"><span><strong>${zones.length}</strong>${t("zonesCount")}</span><span><strong>${journal.trace.length}</strong>${t("calls")}</span><span><strong>${nbAlertes}</strong>${t("al").alerte}</span></div></div><div class="hero-signal"><div class="signal-ring" style="--progress:${signal}%"><div class="signal-value"><strong>${signal}%</strong><span>${t("signal")}</span></div></div></div></section>
 ${panneauCommande()}
 ${journal.resume?`<div class="resume"><h3>${t("resume")}</h3>${enGras(journal.resume)}</div>`:""}
 <div class="grille">${zones.map(carteZone).join("")}</div>
 <section class="chat"><h2>${t("chat")}</h2><p class="petit">${t("chatNote")}</p>
 <div class="onglets">${zones.map((z,i)=>`<button aria-pressed="${i===zoneChat}" onclick="choisirZone(${i})">${echapper(z.nom)}</button>`).join("")}</div>
 <div class="fil">${zones[zoneChat]?fil(zones[zoneChat]):""}</div></section>
 <details ${traceOuverte?"open":""} ontoggle="traceOuverte=this.open"><summary>${t("trace")}</summary>${lignes}</details>
 <footer>${t("pied")}</footer>`;
}
function changerLangue(l){langue=l;try{localStorage.setItem("eauracle_langue",l)}catch(e){}rendre()}
function choisirZone(i){zoneChat=i;rendre()}

function panneauCommande(){
 if(!apiDispo)return "";
 const dernier=(journal.trace||[]).slice(-1)[0];
 return `<section class="commande"><h3>${t("lancer")}</h3>
 <div>${t("zonesTitre")}</div><div class="choix">${ZONES_CHOIX.map(z=>`<label><input type="checkbox" value="${z}" ${zonesChoisies.includes(z)?"checked":""} ${enCours?"disabled":""} onchange="majZones()"> ${z}</label>`).join("")}</div>
 <label>${t("donnees")} <select ${enCours?"disabled":""} onchange="dateChoisie=this.value"><option value="2002-08-04" ${dateChoisie?"selected":""}>${t("dateRejeu")}</option><option value="" ${dateChoisie?"":"selected"}>${t("dateDirect")}</option></select></label><br>
 <button class="lancer" onclick="lancerAgent()" ${enCours?"disabled":""}>${enCours?t("enCours")+"…":t("lancer")}</button>
 <p class="petit">${enCours&&dernier?t("dernier")+": "+echapper(dernier.outil):t("lancerNote")}</p>
 ${erreurAgent?`<div class="erreur"><strong>${t("echec")}.</strong> ${echapper(erreurAgent)}</div>`:""}</section>`;
}
function majZones(){zonesChoisies=[...document.querySelectorAll(".commande .choix input:checked")].map(c=>c.value)}
async function lancerAgent(){
 majZones();if(!zonesChoisies.length||enCours)return;
 erreurAgent=null;
 try{
  const r=await fetch("api/lancer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({zones:zonesChoisies,date:dateChoisie})});
  if(!r.ok){erreurAgent=(await r.json().catch(()=>({}))).erreur||("HTTP "+r.status);rendre();return}
 }catch(e){erreurAgent=String(e);rendre();return}
 enCours=true;source="vivant";zoneChat=0;signature="";
 journal={meta:{date:dateChoisie||null,rejeu:!!dateChoisie},trace:[],resume:""};
 rendre();sonder();
}
function sonder(){
 clearInterval(minuterie);
 minuterie=setInterval(async()=>{
  try{
   const e=await (await fetch("api/etat",{cache:"no-store"})).json();
   const nouvelle=e.trace.length+"|"+e.statut+"|"+(e.erreur||"");
   enCours=e.statut==="en_cours";erreurAgent=e.erreur;
   if(nouvelle!==signature){signature=nouvelle;journal={meta:e.meta,trace:e.trace,resume:e.resume};rendre()}
   if(!enCours)clearInterval(minuterie);
  }catch(x){}
 },800);
}
async function verifierApi(){
 try{const r=await fetch("api/etat",{cache:"no-store"});if(!r.ok)return;apiDispo=true;
  const e=await r.json();if(e.statut==="en_cours"){enCours=true;source="vivant";sonder()}}catch(x){}
}
// Au chargement : journal.json s'il existe (serveur), sinon l'exécution d'exemple intégrée ; puis détection du serveur.
fetch("journal.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j&&j.trace&&j.trace.length){journal=j;source="reel"}}).catch(()=>{}).then(verifierApi).finally(rendre);
</script>
</body>
</html>
