<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eauracle</title>
<style>
:root{--fond:#f5f1e8;--carte:#fffdf8;--encre:#102a43;--doux:#687886;--bord:#d8d0c3;--eau:#1667ff;--eau-claire:#dce9ff;--corail:#ff684d;--surEau:#fff;--n-faible:#159a72;--n-moyen:#bd7a00;--n-eleve:#e75a37;--n-crue_en_cours:#cf2940;--a-vigilance:#bd7a00;--a-alerte:#e75a37;--a-urgence:#cf2940;color-scheme:light}
*{box-sizing:border-box}html{min-height:100%;background:var(--fond)}
body{min-height:100vh;margin:0;background:var(--fond);color:var(--encre);font:15px/1.55 Arial,Helvetica,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:linear-gradient(rgba(16,42,67,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(16,42,67,.045) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 72%)}
main{max-width:1240px;margin:0 auto;padding:26px 26px 68px;position:relative}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.055em}h1{font-size:clamp(2.5rem,5vw,5.2rem);line-height:.88;letter-spacing:-.09em}h2{font-size:1.55rem}h3{font-size:1rem;letter-spacing:-.025em}
.entete{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:14px 0 22px;border-bottom:2px solid var(--encre)}.entete p{max-width:50ch;margin:13px 0 0;color:var(--doux);font-size:.92rem}.entete:before{content:"EA / 01";position:absolute;right:26px;top:8px;font-size:.68rem;font-weight:700;letter-spacing:.16em;color:var(--eau)}
.langues{display:flex;margin-top:5px}.langues button{font:inherit;font-size:.72rem;padding:8px 12px;border:1px solid var(--encre);background:transparent;color:var(--encre);cursor:pointer}.langues button:first-child{border-radius:4px 0 0 4px}.langues button:last-child{border-radius:0 4px 4px 0;border-left:0}.langues button[aria-pressed=true]{background:var(--encre);color:#fff}
button:focus-visible,summary:focus-visible{outline:3px solid var(--corail);outline-offset:3px}.bandeau{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.etiq{padding:5px 9px;border:1px solid var(--bord);background:rgba(255,255,255,.5);color:var(--doux);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em}.etiq:before{content:"/";color:var(--eau);margin-right:6px;font-weight:800}.etiq.alerte{border-color:var(--corail);color:var(--corail)}
.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:30px;align-items:end;margin:22px 0 24px;padding:34px 34px 27px;background:var(--eau);color:#fff;position:relative;overflow:hidden;min-height:300px;box-shadow:12px 12px 0 #cbd9ee}
.hero:before{content:"OUÉMÉ";position:absolute;right:-12px;top:-47px;font-size:11rem;font-weight:900;letter-spacing:-.13em;color:rgba(255,255,255,.08);transform:rotate(-8deg)}.hero:after{content:"";position:absolute;right:4%;bottom:-70px;width:320px;height:180px;border:1px solid rgba(255,255,255,.42);border-radius:50%;box-shadow:0 0 0 22px rgba(255,255,255,.1),0 0 0 44px rgba(255,255,255,.06);transform:rotate(-18deg)}.hero-copy{position:relative;z-index:1}.hero-kicker{display:flex;align-items:center;gap:8px;font-size:.68rem;font-weight:800;letter-spacing:.16em}.hero-kicker i{width:8px;height:8px;background:var(--corail);border-radius:50%;border:2px solid #fff}.hero h2{max-width:12ch;font-size:clamp(2.2rem,5vw,4.8rem);line-height:.86;margin:17px 0;letter-spacing:-.09em}.hero-copy p{max-width:43ch;color:#dce9ff;font-size:.9rem}.hero-flow{height:30px;margin-top:24px;border-bottom:2px solid rgba(255,255,255,.72);border-radius:50%;transform:skewX(-25deg);position:relative}.hero-flow:before{content:"";position:absolute;left:8%;right:18%;bottom:11px;border-bottom:1px solid rgba(255,255,255,.42);border-radius:50%}.hero-meta{display:flex;gap:20px;margin-top:19px;color:#d7e4ff;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}.hero-meta strong{color:#fff;font-size:1.3rem;display:block;letter-spacing:-.08em}.hero-signal{display:flex;justify-content:flex-end;align-items:center;position:relative;z-index:1}.signal-ring{width:170px;height:170px;border:1px solid rgba(255,255,255,.5);border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--progress),rgba(255,255,255,.16) 0);box-shadow:inset 0 0 0 10px var(--eau),inset 0 0 0 11px rgba(255,255,255,.3)}.signal-value{text-align:center}.signal-value strong{display:block;font-size:2.8rem;letter-spacing:-.1em}.signal-value span{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:#d7e4ff}.resume{background:#e8f0fc;border-left:5px solid var(--eau);padding:15px 18px;margin:8px 0 23px}.resume h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--eau);margin-bottom:7px}
.commande,.carte,.fil,details{background:var(--carte);border:1px solid var(--bord);border-radius:3px;padding:21px;box-shadow:4px 4px 0 rgba(16,42,67,.08)}.commande{margin:0 0 25px;display:flex;align-items:center;gap:23px;flex-wrap:wrap}.commande h3{font-size:1.3rem}.commande .choix{display:flex;flex-wrap:wrap;gap:8px 15px;flex:1}.commande label{font-size:.8rem}.commande input{accent-color:var(--eau)}.commande select{font:inherit;font-size:.8rem;padding:8px;border:1px solid var(--encre);background:transparent;color:var(--encre);margin-left:5px}.commande .petit{flex-basis:100%}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:19px}.carte{transition:transform .2s,box-shadow .2s}.carte:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--eau-claire)}.tete{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:17px}.tete h2:before{content:"";display:inline-block;width:12px;height:12px;background:var(--eau);margin-right:10px}.puce{--c:var(--doux);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid var(--c);padding:3px 8px;border-radius:2px;font-weight:700;font-size:.7rem;white-space:nowrap}.jauge{height:13px;background:#e8e4dc;position:relative;overflow:hidden}.jauge i{position:absolute;inset:0 auto 0 0;background:var(--n-faible);animation:montee .8s ease-out}.jauge b{position:absolute;top:0;bottom:0;width:1px;background:var(--encre);opacity:.5}@keyframes montee{from{width:0!important}}.legende{display:flex;justify-content:space-between;font-size:.7rem;color:var(--doux);margin:7px 0 16px}.legende span:first-child{color:var(--encre);font-weight:700}.mesures{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bord);border:1px solid var(--bord);margin-bottom:16px}.mesures div{background:var(--carte);padding:10px 9px}.mesures strong{display:block;font-size:1.05rem;letter-spacing:-.06em}.mesures span{font-size:.67rem;color:var(--doux)}.photo{display:grid;grid-template-columns:170px 1fr;gap:15px;margin:13px 0}.photo img,.vide{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--bord)}.photo img{filter:saturate(.8) contrast(1.05)}.vide{display:flex;align-items:center;justify-content:center;text-align:center;font-size:.76rem;color:var(--doux);padding:6px;background:#f1eee8}.barre{height:7px;background:#e6e1d8;overflow:hidden;margin:6px 0 9px}.barre i{display:block;height:100%;background:var(--corail)}.petit{font-size:.76rem;color:var(--doux);margin:5px 0}ul.desc{margin:7px 0 0;padding-left:17px;font-size:.8rem}.alerte-msg{border:2px solid var(--c);padding:12px;margin-top:12px;background:#fff}.alerte-msg p{margin:7px 0}.decision{font-size:.8rem;color:var(--doux);margin-top:14px;padding-top:13px;border-top:1px dashed var(--bord)}
.chat{margin-top:31px}.onglets{display:flex;gap:6px;margin:12px 0}.onglets button{font:inherit;font-size:.76rem;padding:7px 13px;border:1px solid var(--encre);background:transparent;color:var(--encre);cursor:pointer}.onglets button[aria-pressed=true]{background:var(--encre);color:#fff}.fil{display:flex;flex-direction:column;gap:10px;min-height:120px}.msg{max-width:78%;padding:10px 13px;border-left:3px solid var(--eau);background:#edf3fb;font-size:.82rem}.msg small{display:block;color:var(--eau);margin-bottom:3px;font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.msg.relais{align-self:flex-end;border-left:0;border-right:3px solid var(--corail);background:#fff1ec}.msg.sys{align-self:center;max-width:100%;font-size:.73rem;color:var(--doux);text-align:center;background:transparent;border:0}.msg img{width:220px;max-width:100%;display:block;margin-top:6px}.barre i{border-radius:0}details{margin-top:25px;padding:14px 18px}summary{cursor:pointer;font-weight:800}.ligne{display:grid;grid-template-columns:34px 170px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--bord);font-size:.72rem}.ligne code{word-break:break-word;color:var(--doux)}footer{margin-top:27px;font-size:.73rem;color:var(--doux);max-width:80ch}button.lancer{background:var(--corail);color:#fff;border:0;border-radius:2px;padding:11px 19px;font:inherit;font-size:.8rem;font-weight:800;cursor:pointer;box-shadow:4px 4px 0 #ffc1b4;transition:transform .2s}button.lancer:hover{transform:translate(-2px,-2px)}button.lancer:disabled{opacity:.55;cursor:wait}.erreur{border:2px solid var(--corail);color:var(--corail);background:#fff1ec;padding:9px 12px;margin-top:12px;font-size:.78rem}
@media(max-width:700px){main{padding:18px 15px 50px}.entete{padding-bottom:18px}.hero{grid-template-columns:1fr;padding:24px;min-height:0}.hero h2{font-size:3.1rem}.hero-signal{justify-content:flex-start}.signal-ring{width:135px;height:135px}.commande{display:block}.commande .choix{margin:14px 0}.mesures{grid-template-columns:repeat(2,1fr)}.photo{grid-template-columns:1fr}.ligne{grid-template-columns:28px 1fr}.ligne code{grid-column:1/-1}.msg{max-width:92%}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
// Journal par défaut : exécution réelle de l'agent (rejeu 2002-08-04). Remplacé par journal.json s'il existe.
const DONNEES_DEMO={meta:{date:"2002-08-04",rejeu:true,fournisseur:"baseten",modele:"meta-models/muse-spark-open-1026"},
trace:[
{tour:1,outil:"get_flood_risk",arguments:{zone:"Bonou"},resultat:{zone:"Bonou",date:"2002-08-04",mode:"rejeu historique",score_risque:0.724,niveau:"moyen",debit_actuel_m3s:376.6,debit_relatif_au_seuil_crue:0.58,variation_3j_relative:0.137,pluie_7j_mm:33.6,source:"GloFAS (simulé) + Open-Meteo"}},
{tour:1,outil:"get_flood_risk",arguments:{zone:"Porto-Novo"},resultat:{zone:"Porto-Novo",date:"2002-08-04",mode:"rejeu historique",score_risque:0.949,niveau:"élevé",debit_actuel_m3s:380.1,debit_relatif_au_seuil_crue:0.56,variation_3j_relative:0.149,pluie_7j_mm:25.6,source:"GloFAS (simulé) + Open-Meteo"}},
{tour:2,outil:"request_photos",arguments:{zone:"Bonou",raison:"Risque moyen (score 0.72) à Bonou - vérification terrain nécessaire"},resultat:{zone:"Bonou",statut:"photo_recue",chemin_photo:"Bonou_1.jpg"}},
{tour:2,outil:"request_photos",arguments:{zone:"Porto-Novo",raison:"Risque élevé (score 0.95) à Porto-Novo - vérification terrain nécessaire"},resultat:{zone:"Porto-Novo",statut:"photo_recue",chemin_photo:"Porto-Novo_1.jpg"}},
{tour:3,outil:"analyze_flood_photo",arguments:{chemin_photo:"Bonou_1.jpg"},resultat:{photo:"Bonou_1.jpg",part_eau_mesuree_pct:42.1,regions_detectees:1,confiance_sam:0.96,gravite:"elevee",methode:"segmentation SAM 3.1 (masques) ; seuils de gravité heuristiques",description_muse:["Eau boueuse marron couvrant toute la chaussée entre les bâtiments"]}},
{tour:3,outil:"analyze_flood_photo",arguments:{chemin_photo:"Porto-Novo_1.jpg"},resultat:{photo:"Porto-Novo_1.jpg",part_eau_mesuree_pct:55.7,regions_detectees:1,confiance_sam:0.98,gravite:"elevee",methode:"segmentation SAM 3.1 (masques) ; seuils de gravité heuristiques",description_muse:["Chaussée entièrement recouverte d'eau boueuse brunâtre"]}},
{tour:4,outil:"draft_alert",arguments:{zone:"Bonou",niveau:"alerte",public:"habitants"},resultat:{zone:"Bonou",niveau:"alerte",public:"habitants",message:"Alerte inondation pour la zone de Bonou. Le fleuve risque de déborder et d'inonder les habitations proches. Quittez les zones basses et mettez-vous en hauteur dès maintenant.",origine:"Muse Spark Open"}},
{tour:4,outil:"draft_alert",arguments:{zone:"Porto-Novo",niveau:"alerte",public:"habitants"},resultat:{zone:"Porto-Novo",niveau:"alerte",public:"habitants",message:"Alerte inondation pour la zone de Porto-Novo. Une montée des eaux du bassin de l'Ouémé est possible dans votre secteur. Mettez-vous à l'abri en hauteur dès maintenant.",origine:"Muse Spark Open"}},
{tour:5,outil:"send_alert",arguments:{zone:"Bonou"},resultat:{zone:"Bonou",statut:"envoye_simule"}},
{tour:5,outil:"send_alert",arguments:{zone:"Porto-Novo"},resultat:{zone:"Porto-Novo",statut:"envoye_simule"}},
{tour:6,outil:"log_decision",arguments:{zone:"Bonou"},resultat:{zone:"Bonou",justification:"Risque moyen score 0.724 (débit simulé GloFAS 376.6 m3/s, 58% seuil crue, +13.7% en 3j, pluie 33.6mm/7j) recoupé avec photo gravité élevée (42.1% eau, confiance SAM 0.96, eau boueuse chaussée submergée) => alerte habitants envoyée."}},
{tour:6,outil:"log_decision",arguments:{zone:"Porto-Novo"},resultat:{zone:"Porto-Novo",justification:"Risque élevé score 0.949 (débit simulé GloFAS 380.1 m3/s, 56% seuil crue, +14.9% en 3j, pluie 25.6mm/7j) recoupé avec photo gravité élevée SAM 55.7% (confiance 0.98, eau à mi-mollet, Muse: moyenne) => alerte habitants envoyée, niveau urgence non retenu par prudence."}}],
resume:"**Résumé Eauracle - 2002-08-04 (rejeu historique) :**\n- **Bonou :** risque moyen (score 0,72) confirmé par photo terrain gravité élevée (42,1% d'eau, confiance 0,96) → **alerte** envoyée aux habitants.\n- **Porto-Novo :** risque élevé (score 0,95) recoupé avec photo gravité élevée (55,7%, confiance 0,98, discordance Muse : moyenne) → **alerte** envoyée (niveau urgence non retenu par prudence)."};

const SEUIL_MOYEN=0.088,SEUIL_ELEVE=0.859; // niveaux calibrés à l'entraînement ; à mettre à jour si le modèle est réentraîné
const TEXTES={
en:{sous:"An AI agent that watches flood risk on the Ouémé river, Benin, checks it against field photos, and drafts warnings for residents.",
 rejeu:"Historical replay of",direct:"Today's data",reel:"Run saved by the agent",exemple:"Built-in sample run",modele:"Model",simule:"Simulated discharge data",brouillons:"Alerts are simulated drafts. A local authority must validate them.",
 resume:"What the agent concluded",score:"Risk score",debit:"Discharge",seuil:"of flood threshold",var3j:"3-day change",pluie:"Rain, 7 days",
 photo:"Field photo",partEau:"Water share of the image",confiance:"SAM 3.1 confidence",gravite:"Severity",aucune:"No photo received. Decision based on the score alone.",
 sansImage:"Photo not found in app/photos",alerte:"Draft alert",langueAlerte:"Message text in French, as it would reach residents.",decision:"Agent's reasoning",
 envoye:"Simulated send. Nothing was actually transmitted.",chat:"Conversation with the local relay",chatNote:"Simulated relay. Messages are built from the agent's real tool calls.",
 trace:"Agent trace: every tool call",demande:"Agent asks the relay for a photo",relais:"Local relay",agent:"Eauracle agent",
 recu:"Photo sent by the relay",mesure:"SAM 3.1 measured",d_eau:"of the image covered by water, severity",systeme:"Simulated send recorded. Awaiting validation by local authority.",
 pied:"Discharge comes from the GloFAS simulation, not station measurements. Rain comes from Open-Meteo. Severity thresholds (10% and 30% water share) are heuristics. The risk model is one signal among others: the agent also weighs photos.",
 lancer:"Run the agent",zonesTitre:"Zones to analyze",donnees:"Data",dateRejeu:"Replay of the August 2002 flood",dateDirect:"Today's live data",enCours:"The agent is working",dernier:"Last tool call",termine:"Run finished",echec:"The run failed",lancerNote:"Runs the real agent: Muse Spark Open on Baseten and SAM 3.1 on the Meta Model API. It takes about a minute.",vivant:"Run launched from this page",kicker:"OUÉMÉ BASIN / EARLY WARNING",heroTitle:"Read the river before it rises.",heroCopy:"A calm interface for a complex decision: model signals, field evidence and one accountable next action.",signal:"risk signal",zonesCount:"zones watched",calls:"agent calls",
 niv:{faible:"Low",moyen:"Medium",eleve:"High",crue_en_cours:"Flood under way"},al:{vigilance:"Watch",alerte:"Warning",urgence:"Emergency"},gr:{faible:"low",moyenne:"medium",elevee:"high"},lang:"Language"},
fr:{sous:"Un agent IA qui surveille le risque d'inondation de l'Ouémé au Bénin, le recoupe avec des photos de terrain et rédige des alertes pour les habitants.",
 rejeu:"Rejeu historique du",direct:"Données du jour",reel:"Exécution enregistrée par l'agent",exemple:"Exécution d'exemple intégrée",modele:"Modèle",simule:"Débit simulé",brouillons:"Les alertes sont des brouillons simulés. Une autorité locale doit les valider.",
 resume:"Conclusion de l'agent",score:"Score de risque",debit:"Débit",seuil:"du seuil de crue",var3j:"Variation sur 3 jours",pluie:"Pluie, 7 jours",
 photo:"Photo de terrain",partEau:"Part d'eau dans l'image",confiance:"Confiance SAM 3.1",gravite:"Gravité",aucune:"Aucune photo reçue. Décision fondée sur le score seul.",
 sansImage:"Photo introuvable dans app/photos",alerte:"Brouillon d'alerte",langueAlerte:"Texte en français, tel qu'il parviendrait aux habitants.",decision:"Raisonnement de l'agent",
 envoye:"Envoi simulé. Rien n'a été réellement transmis.",chat:"Conversation avec le relais local",chatNote:"Relais simulé. Les messages sont construits à partir des vrais appels d'outils de l'agent.",
 trace:"Trace de l'agent : chaque appel d'outil",demande:"L'agent demande une photo au relais",relais:"Relais local",agent:"Agent Eauracle",
 recu:"Photo envoyée par le relais",mesure:"SAM 3.1 a mesuré",d_eau:"de l'image couverte d'eau, gravité",systeme:"Envoi simulé enregistré. En attente de validation par l'autorité locale.",
 pied:"Le débit vient de la simulation GloFAS, pas de mesures de station. La pluie vient d'Open-Meteo. Les seuils de gravité (10 % et 30 % d'eau) sont des heuristiques. Le modèle de risque est un signal parmi d'autres : l'agent pèse aussi les photos.",
 lancer:"Lancer l'agent",zonesTitre:"Zones à analyser",donnees:"Données",dateRejeu:"Rejeu de la crue d'août 2002",dateDirect:"Données du jour",enCours:"L'agent travaille",dernier:"Dernier outil appelé",termine:"Exécution terminée",echec:"L'exécution a échoué",lancerNote:"Lance le vrai agent : Muse Spark Open sur Baseten et SAM 3.1 sur la Meta Model API. Compter environ une minute.",vivant:"Exécution lancée depuis cette page",kicker:"BASSIN DE L'OUÉMÉ / ALERTE PRÉCOCE",heroTitle:"Lire le fleuve avant qu'il ne monte.",heroCopy:"Une interface calme pour une décision complexe : signaux du modèle, preuve terrain et prochaine action traçable.",signal:"signal de risque",zonesCount:"zones suivies",calls:"appels agent",
 niv:{faible:"Faible",moyen:"Moyen",eleve:"Élevé",crue_en_cours:"Crue en cours"},al:{vigilance:"Vigilance",alerte:"Alerte",urgence:"Urgence"},gr:{faible:"faible",moyenne:"moyenne",elevee:"élevée"},lang:"Langue"}};

let langue="en",journal=DONNEES_DEMO,source="exemple",zoneChat=0;
let apiDispo=false,enCours=false,erreurAgent=null,traceOuverte=false,signature="",minuterie=null;
let zonesChoisies=["Bonou","Porto-Novo"],dateChoisie="2002-08-04";
const ZONES_CHOIX=["Bonou","Porto-Novo","Adjohoun","Dangbo"];
try{langue=localStorage.getItem("eauracle_langue")||"en"}catch(e){}
const t=c=>TEXTES[langue][c];
const echapper=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normaliser=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g,"_");
const nomFichier=c=>String(c||"").split(/[\\/]/).pop();
const nombre=(x,d=1)=>Number(x).toLocaleString(langue==="fr"?"fr-FR":"en-US",{maximumFractionDigits:d});
const enGras=s=>echapper(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/^- /gm,"• ").replace(/\n/g,"<br>");

function construireZones(trace){
 const zones=new Map();
 const zone=n=>{if(!zones.has(n))zones.set(n,{nom:n});return zones.get(n)};
 for(const e of trace){
  const r=e.resultat||{},a=e.arguments||{};
  if(e.outil==="get_flood_risk")zone(a.zone||r.zone).risque=r;
  else if(e.outil==="request_photos")zone(a.zone||r.zone).demande={...r,raison:a.raison};
  else if(e.outil==="analyze_flood_photo"){const f=r.photo||nomFichier(a.chemin_photo);zone(f.split("_")[0]).analyse={...r,fichier:f}}
  else if(e.outil==="draft_alert")zone(a.zone||r.zone).brouillon=r;
  else if(e.outil==="send_alert")zone(a.zone||r.zone).envoi=r;
  else if(e.outil==="log_decision")zone(a.zone||r.zone).decision=r.justification;
 }
 return [...zones.values()];
}
const imageHtml=f=>`<img src="photos/${encodeURIComponent(f)}" alt="${echapper(f)}" onerror="this.outerHTML='<div class=vide>${echapper(t("sansImage"))}</div>'">`;

function carteZone(z){
 const r=z.risque||{},n=normaliser(r.niveau),a=z.analyse,b=z.brouillon,s=Number(r.score_risque||0);
 const gr=a?normaliser(a.gravite):"";
 const photo=a?`<div class="photo">${imageHtml(a.fichier)}<div>
  <strong>${t("partEau")}: ${nombre(a.part_eau_mesuree_pct)}%</strong>
  <div class="barre"><i style="width:${Math.min(100,a.part_eau_mesuree_pct)}%"></i></div>
  <div class="petit">${t("confiance")}: ${nombre(a.confiance_sam,2)}</div>
  <div class="petit">${t("gravite")}: <span class="puce" style="--c:var(--n-${gr==="elevee"?"eleve":gr==="moyenne"?"moyen":"faible"})">${echapper(t("gr")[gr]||a.gravite)}</span></div>
  <ul class="desc">${(a.description_muse||[]).map(d=>`<li>${echapper(d)}</li>`).join("")}</ul></div></div>`
  :`<p class="petit">${t("aucune")}</p>`;
 const al=b?`<div class="alerte-msg" style="--c:var(--a-${b.niveau})"><span class="puce" style="--c:var(--a-${b.niveau})">${echapper(t("al")[b.niveau]||b.niveau)}</span>
  <p>${echapper(b.message)}</p><div class="petit">${t("langueAlerte")} ${z.envoi?t("envoye"):""}</div></div>`:"";
 return `<section class="carte"><div class="tete"><h2>${echapper(z.nom)}</h2><span class="puce" style="--c:var(--n-${n})">${echapper(t("niv")[n]||r.niveau)}</span></div>
 <div class="jauge" role="img" aria-label="${t("score")} ${nombre(s,2)}"><i style="width:${Math.round(s*100)}%;background:var(--n-${n})"></i><b style="left:${SEUIL_MOYEN*100}%"></b><b style="left:${SEUIL_ELEVE*100}%"></b></div>
 <div class="legende"><span>${t("score")}: ${nombre(s,2)}</span><span>${t("niv").moyen} ${SEUIL_MOYEN} | ${t("niv").eleve} ${SEUIL_ELEVE}</span></div>
 <div class="mesures"><div><strong>${nombre(r.debit_actuel_m3s)} m³/s</strong><span>${t("debit")}</span></div>
 <div><strong>${Math.round((r.debit_relatif_au_seuil_crue||0)*100)}%</strong><span>${t("seuil")}</span></div>
 <div><strong>${r.variation_3j_relative>=0?"+":""}${nombre((r.variation_3j_relative||0)*100)}%</strong><span>${t("var3j")}</span></div>
 <div><strong>${nombre(r.pluie_7j_mm)} mm</strong><span>${t("pluie")}</span></div></div>
 <h3>${t("photo")}</h3>${photo}${al}
 ${z.decision?`<div class="decision"><strong>${t("decision")}.</strong> ${echapper(z.decision)}</div>`:""}</section>`;
}

function fil(z){
 const m=[],r=z.risque||{},a=z.analyse,b=z.brouillon;
 if(z.demande)m.push(`<div class="msg agent"><small>${t("agent")}</small>${t("demande")}: ${echapper(z.demande.raison||"")}</div>`);
 if(z.demande&&a)m.push(`<div class="msg relais"><small>${t("relais")}</small>${t("recu")}${imageHtml(a.fichier)}</div>`);
 else if(z.demande)m.push(`<div class="msg relais"><small>${t("relais")}</small>${t("aucune")}</div>`);
 if(a)m.push(`<div class="msg agent"><small>${t("agent")}</small>${t("mesure")} ${nombre(a.part_eau_mesuree_pct)}% ${t("d_eau")} ${echapper(t("gr")[normaliser(a.gravite)]||a.gravite)} (${t("confiance").toLowerCase()} ${nombre(a.confiance_sam,2)}).</div>`);
 if(b)m.push(`<div class="msg agent"><small>${t("agent")} | ${echapper(t("al")[b.niveau]||b.niveau)}</small>${echapper(b.message)}</div>`);
 if(z.envoi)m.push(`<div class="msg sys">${t("systeme")}</div>`);
 if(z.decision)m.push(`<div class="msg agent"><small>${t("decision")}</small>${echapper(z.decision)}</div>`);
 return m.join("");
}

function rendre(){
 document.documentElement.lang=langue;
 const zones=construireZones(journal.trace||[]);
 if(zoneChat>=zones.length)zoneChat=0;
 const meta=journal.meta||{};
 const scores=zones.map(z=>Number(z.risque?.score_risque||0)).filter(Number.isFinite);
 const scoreGlobal=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
 const signal=Math.round(scoreGlobal*100);
 const nbAlertes=zones.filter(z=>z.brouillon||z.envoi).length;
 const lignes=(journal.trace||[]).map(e=>`<div class="ligne"><span>${e.tour}</span><strong>${echapper(e.outil)}</strong><code>${echapper(JSON.stringify(e.arguments)).slice(0,160)} → ${echapper(JSON.stringify(e.resultat)).slice(0,240)}</code></div>`).join("");
 document.getElementById("app").innerHTML=`
 <div class="entete"><div><h1>Eauracle</h1><p>${t("sous")}</p></div>
 <div class="langues" role="group" aria-label="${t("lang")}"><button aria-pressed="${langue==="en"}" onclick="changerLangue('en')">English</button><button aria-pressed="${langue==="fr"}" onclick="changerLangue('fr')">Français</button></div></div>
 <div class="bandeau"><span class="etiq">${meta.rejeu?t("rejeu")+" "+echapper(meta.date):t("direct")}</span><span class="etiq">${t(source)}</span>
 ${meta.modele?`<span class="etiq">${t("modele")}: ${echapper(meta.modele)}</span>`:""}<span class="etiq">${t("simule")}</span><span class="etiq alerte">${t("brouillons")}</span></div>
 <section class="hero"><div class="hero-copy"><div class="hero-kicker"><i></i>${t("kicker")}</div><h2>${t("heroTitle")}</h2><p>${t("heroCopy")}</p><div class="hero-flow"></div><div class="hero-meta"><span><strong>${zones.length}</strong>${t("zonesCount")}</span><span><strong>${journal.trace.length}</strong>${t("calls")}</span><span><strong>${nbAlertes}</strong>${t("al").alerte}</span></div></div><div class="hero-signal"><div class="signal-ring" style="--progress:${signal}%"><div class="signal-value"><strong>${signal}%</strong><span>${t("signal")}</span></div></div></div></section>
 ${panneauCommande()}
 ${journal.resume?`<div class="resume"><h3>${t("resume")}</h3>${enGras(journal.resume)}</div>`:""}
 <div class="grille">${zones.map(carteZone).join("")}</div>
 <section class="chat"><h2>${t("chat")}</h2><p class="petit">${t("chatNote")}</p>
 <div class="onglets">${zones.map((z,i)=>`<button aria-pressed="${i===zoneChat}" onclick="choisirZone(${i})">${echapper(z.nom)}</button>`).join("")}</div>
 <div class="fil">${zones[zoneChat]?fil(zones[zoneChat]):""}</div></section>
 <details ${traceOuverte?"open":""} ontoggle="traceOuverte=this.open"><summary>${t("trace")}</summary>${lignes}</details>
 <footer>${t("pied")}</footer>`;
}
function changerLangue(l){langue=l;try{localStorage.setItem("eauracle_langue",l)}catch(e){}rendre()}
function choisirZone(i){zoneChat=i;rendre()}

function panneauCommande(){
 if(!apiDispo)return "";
 const dernier=(journal.trace||[]).slice(-1)[0];
 return `<section class="commande"><h3>${t("lancer")}</h3>
 <div>${t("zonesTitre")}</div><div class="choix">${ZONES_CHOIX.map(z=>`<label><input type="checkbox" value="${z}" ${zonesChoisies.includes(z)?"checked":""} ${enCours?"disabled":""} onchange="majZones()"> ${z}</label>`).join("")}</div>
 <label>${t("donnees")} <select ${enCours?"disabled":""} onchange="dateChoisie=this.value"><option value="2002-08-04" ${dateChoisie?"selected":""}>${t("dateRejeu")}</option><option value="" ${dateChoisie?"":"selected"}>${t("dateDirect")}</option></select></label><br>
 <button class="lancer" onclick="lancerAgent()" ${enCours?"disabled":""}>${enCours?t("enCours")+"…":t("lancer")}</button>
 <p class="petit">${enCours&&dernier?t("dernier")+": "+echapper(dernier.outil):t("lancerNote")}</p>
 ${erreurAgent?`<div class="erreur"><strong>${t("echec")}.</strong> ${echapper(erreurAgent)}</div>`:""}</section>`;
}
function majZones(){zonesChoisies=[...document.querySelectorAll(".commande .choix input:checked")].map(c=>c.value)}
async function lancerAgent(){
 majZones();if(!zonesChoisies.length||enCours)return;
 erreurAgent=null;
 try{
  const r=await fetch("api/lancer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({zones:zonesChoisies,date:dateChoisie})});
  if(!r.ok){erreurAgent=(await r.json().catch(()=>({}))).erreur||("HTTP "+r.status);rendre();return}
 }catch(e){erreurAgent=String(e);rendre();return}
 enCours=true;source="vivant";zoneChat=0;signature="";
 journal={meta:{date:dateChoisie||null,rejeu:!!dateChoisie},trace:[],resume:""};
 rendre();sonder();
}
function sonder(){
 clearInterval(minuterie);
 minuterie=setInterval(async()=>{
  try{
   const e=await (await fetch("api/etat",{cache:"no-store"})).json();
   const nouvelle=e.trace.length+"|"+e.statut+"|"+(e.erreur||"");
   enCours=e.statut==="en_cours";erreurAgent=e.erreur;
   if(nouvelle!==signature){signature=nouvelle;journal={meta:e.meta,trace:e.trace,resume:e.resume};rendre()}
   if(!enCours)clearInterval(minuterie);
  }catch(x){}
 },800);
}
async function verifierApi(){
 try{const r=await fetch("api/etat",{cache:"no-store"});if(!r.ok)return;apiDispo=true;
  const e=await r.json();if(e.statut==="en_cours"){enCours=true;source="vivant";sonder()}}catch(x){}
}
// Au chargement : journal.json s'il existe (serveur), sinon l'exécution d'exemple intégrée ; puis détection du serveur.
fetch("journal.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j&&j.trace&&j.trace.length){journal=j;source="reel"}}).catch(()=>{}).then(verifierApi).finally(rendre);
</script>
</body>
</html>
